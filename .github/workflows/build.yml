name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$SDK/licenses/android-sdk-license"
          echo "sdk.dir=$SDK" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk shagomer.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shagomer-apk
          path: shagomer.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Шагомер — сборка ${{ github.run_number }}
          body: |
            Файл для установки на Android: **shagomer.apk** (ниже, в разделе Assets).

            Постоянная ссылка на последнюю версию:
            https://github.com/${{ github.repository }}/releases/latest/download/shagomer.apk
          files: shagomer.apk
