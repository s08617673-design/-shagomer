name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk shagomer.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shagomer-apk
          path: shagomer.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Шагомер — сборка ${{ github.run_number }}
          body: |
            Файл для установки на Android: **shagomer.apk** (ниже, в разделе Assets).

            Постоянная ссылка на последнюю версию:
            https://github.com/${{ github.repository }}/releases/latest/download/shagomer.apk
          files: shagomer.apk
