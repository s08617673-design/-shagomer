<style>
/* Layout: a dark screening room. The 16:9 film sits centred, a slim control dock under it. */
:root{
  --night:#141826; --panel:#1f2537; --line:#33405c; --cream:#f4f7ff; --muted:#a9b6d3;
  --sky:#7cc8f4; --ink:#0d1a2b;
  --f-title:"Caveat","Comic Sans MS",cursive;
  --f-ui:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--cream)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.45;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.wrap>*{min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top>div{min-width:0}

.sub{margin:6px 0 0;color:var(--muted);font-size:.92rem;font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-weight:800;font-size:.85rem;letter-spacing:.06em;color:var(--muted);background:transparent;border:0;padding:7px 15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sky);color:var(--ink)}
.stage{position:relative;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.frame{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;margin:0 auto;container-type:inline-size}
.frame canvas{display:block;width:100%;height:100%;cursor:pointer}
.big{position:absolute;left:50%;top:72%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:.7em;border:0;border-radius:999px;background:var(--sky);color:var(--ink);font-family:var(--f-ui);font-weight:900;font-size:clamp(15px,2.3cqw,26px);padding:.75em 1.5em .75em 1.2em;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.big svg{width:1.2em;height:1.2em}
.ctrl{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.ib{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:10px;border:0;background:transparent;color:var(--cream);cursor:pointer}
.ib:hover{background:rgba(255,255,255,.08)}
.ib svg{width:22px;height:22px}
#play{background:var(--sky);color:var(--ink)}
#seek{flex:1;min-width:0;accent-color:var(--sky);height:28px;cursor:pointer}
.time{font-variant-numeric:tabular-nums;font-size:.85rem;font-weight:700;color:var(--muted);white-space:nowrap}
.note{margin:0;color:var(--muted);font-size:.85rem}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.stage:fullscreen{display:flex;align-items:center;justify-content:center;border-radius:0}
.stage:fullscreen .frame{width:min(100vw,177.78vh)}
.stage:-webkit-full-screen{display:flex;align-items:center;justify-content:center;border-radius:0;width:100%;height:100%}
.stage:-webkit-full-screen .frame{width:min(100vw,177.78vh)}
@media (max-width:680px){.stage{border-radius:12px}.time{font-size:.78rem}}
</style>

</div>

 if(m==='wow'){Ln(-ex-8,ey-21,-ex+8,ey-23,dk,3);Ln(ex+8,ey-21,ex-8,ey-23,dk,3);}

}

/* ---------- the flower ---------- */

function wavB64(b){const ch=b.numberOfChannels,sr=b.sampleRate,n=b.length;const dv=new DataView(new ArrayBuffer(44+n*ch*2));const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};ws(0,'RIFF');dv.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,ch,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*ch*2,true);dv.setUint16(32,ch*2,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*ch*2,true);const cs=[];for(let c=0;c<ch;c++)cs.push(b.getChannelData(c));let o=44;for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const v=Math.max(-1,Math.min(1,cs[c][i]));dv.setInt16(o,v<0?v*0x8000:v*0x7fff,true);o+=2;}const u=new Uint8Array(dv.buffer);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
if(VIDEO){
 const wr=document.querySelector('.wrap');if(wr)wr.remove();document.body.style.cssText='margin:0;padding:0;background:#000';
 const c=document.createElement('canvas');c.width=1920;c.height=1080;c.style.cssText='display:block;width:1920px;height:1080px';document.body.appendChild(c);
 mainC=c;mainX=c.getContext('2d');
 window.__dur=DUR;window.renderAt=t=>render(t);
 window.renderAudioWav=async()=>{const sr=44100;const oac=new OfflineAudioContext(2,Math.ceil(sr*(DUR+.5)),sr);const gr=makeGraph(oac);gr.master.gain.setValueAtTime(.95,0);gr.master.gain.setValueAtTime(.95,DUR-1.4);gr.master.gain.linearRampToValueAtTime(0,DUR);for(const e of EV)playEv(oac,gr.bus,e,e.t);const b=await oac.startRendering();return wavB64(b);};
 loadFonts().then(()=>{render(0);window.__ready=true;});
 return;
}

/* ---------- interactive player ---------- */
const $=id=>document.getElementById(id);
const cv=$('cv'),frame=$('frame'),stage=$('stage'),big=$('big'),bigLbl=$('bigLbl'),btnPlay=$('play'),seek=$('seek'),timeEl=$('time'),btnMute=$('mute'),btnFs=$('fs');
mainC=cv;mainX=cv.getContext('2d');
let T=0,started=false,playing=false,muted=false,raf=0,ended=false;
let actx=null,graph=null,anchorT=0,anchorA=0,anchorP=0,evIdx=0;
const POSTER=3.5;
function fmtTime(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function view(){return started?T:POSTER;}
function fit(){const r=frame.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(window.devicePixelRatio||1,2);const w=Math.min(2400,Math.max(320,Math.round(r.width*dpr))),h=Math.round(w*9/16);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}render(view());}
function updateUI(){seek.value=T.toFixed(2);timeEl.textContent=fmtTime(T)+' / '+fmtTime(DUR);}
function setIcons(){$('icoPlay').hidden=playing;$('icoPause').hidden=!playing;btnPlay.setAttribute('aria-label',playing?S().pause:S().watch);$('icoSnd').hidden=muted;$('icoMute').hidden=!muted;btnMute.setAttribute('aria-pressed',String(muted));btnMute.setAttribute('aria-label',muted?S().soundOn:S().soundOff);}
function audioStart(t){
 if(muted)return;
 try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=new AC();}if(actx.state==='suspended')actx.resume();}catch(e){actx=null;return;}
 graph=makeGraph(actx);anchorA=actx.currentTime+.08;anchorT=t;
 evIdx=0;while(evIdx<EV.length&&EV[evIdx].t<t)evIdx++;
 for(const e of EV){if(e.k==='pad'&&e.t<t&&e.t+e.d>t+.3)pad(actx,graph.bus,anchorA,e.n,e.t+e.d-t,e.v);}
 pump();
}
function pump(){if(!graph||!actx)return;const now=actx.currentTime;const horizon=anchorT+(now-anchorA)+1.2;while(evIdx<EV.length&&EV[evIdx].t<horizon){const e=EV[evIdx++];const when=anchorA+(e.t-anchorT);if(when>=now-.02)playEv(actx,graph.bus,e,Math.max(when,now));}}
function audioStop(){if(graph&&actx){const gr=graph;try{gr.master.gain.cancelScheduledValues(actx.currentTime);gr.master.gain.setTargetAtTime(0,actx.currentTime,.04);}catch(e){}setTimeout(()=>{try{gr.master.disconnect();}catch(e){}},400);}graph=null;}
function clockStart(t){anchorT=t;anchorP=performance.now()/1000;audioStart(t);}
function curT(){if(graph&&actx&&actx.state==='running')return anchorT+Math.max(0,actx.currentTime-anchorA);return anchorT+(performance.now()/1000-anchorP);}
function loop(){if(!playing)return;T=curT();if(T>=DUR){T=DUR;render(T);updateUI();stop(true);return;}pump();render(T);updateUI();raf=requestAnimationFrame(loop);}
function play(){if(T>=DUR-.05)T=0;started=true;ended=false;playing=true;big.hidden=true;clockStart(T);setIcons();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
function stop(atEnd){playing=false;audioStop();cancelAnimationFrame(raf);setIcons();if(atEnd){ended=true;bigLbl.textContent=S().again;big.hidden=false;}}
function toggle(){playing?stop(false):play();}
btnPlay.addEventListener('click',toggle);big.addEventListener('click',play);cv.addEventListener('click',toggle);
seek.addEventListener('input',()=>{T=+seek.value;started=true;big.hidden=true;if(playing){audioStop();clockStart(T);}render(T);updateUI();});
btnMute.addEventListener('click',()=>{muted=!muted;if(playing){T=curT();if(muted){audioStop();anchorT=T;anchorP=performance.now()/1000;}else clockStart(T);}setIcons();});
btnFs.addEventListener('click',()=>{const el=stage,d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return;}const req=el.requestFullscreen||el.webkitRequestFullscreen;if(!req)return;try{const p=req.call(el);if(p&&p.catch)p.catch(()=>{});}catch(e){}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!(e.target instanceof HTMLButtonElement)&&!(e.target instanceof HTMLInputElement)){e.preventDefault();toggle();}});
function applyLang(){const s=S();document.documentElement.lang=LANG;$('h1').textContent=s.title;$('sub').textContent=s.sub;$('note').textContent=s.note;bigLbl.textContent=ended?s.again:s.watch;$('langGroup').setAttribute('aria-label',s.lang);seek.setAttribute('aria-label',s.seek);btnFs.setAttribute('aria-label',s.fs);cv.setAttribute('aria-label',s.canvas);$('lang-ru').setAttribute('aria-pressed',String(LANG==='ru'));$('lang-uz').setAttribute('aria-pressed',String(LANG==='uz'));setIcons();render(view());updateUI();}
for(const l of ['ru','uz'])$('lang-'+l).addEventListener('click',()=>{LANG=l;try{localStorage.setItem('tuchka-lang',l);}catch(e){}applyLang();});
if('ResizeObserver' in window)new ResizeObserver(fit).observe(frame);else window.addEventListener('resize',fit);
applyLang();fit();
loadFonts().then(()=>render(view()));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render(view()));
})();
</script>
