<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Тучка 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: a dark screening room. The 16:9 film sits centred, a slim control dock under it. */
:root{
  --night:#141826; --panel:#1f2537; --line:#33405c; --cream:#f4f7ff; --muted:#a9b6d3;
  --sky:#7cc8f4; --ink:#0d1a2b;
  --f-title:"Caveat","Comic Sans MS",cursive;
  --f-ui:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--cream)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.45;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.wrap>*{min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top>div{min-width:0}
h1{font-family:var(--f-title);font-weight:700;font-size:clamp(2.4rem,6vw,3.5rem);line-height:.95;margin:0}
.sub{margin:6px 0 0;color:var(--muted);font-size:.92rem;font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-weight:800;font-size:.85rem;letter-spacing:.06em;color:var(--muted);background:transparent;border:0;padding:7px 15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sky);color:var(--ink)}
.stage{position:relative;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.frame{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;margin:0 auto}
.frame canvas{display:block;width:100%;max-width:100%;height:100%;cursor:pointer}
.big{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:.7em;border:0;border-radius:999px;background:var(--sky);color:var(--ink);font-family:var(--f-ui);font-weight:900;font-size:clamp(15px,2.2vw,26px);padding:.75em 1.5em .75em 1.2em;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.big svg{width:1.2em;height:1.2em}
.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--cream);font-weight:700;background:var(--night)}
.ctrl{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.ib{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:10px;border:0;background:transparent;color:var(--cream);cursor:pointer}
.ib:hover{background:rgba(255,255,255,.08)}
.ib svg{width:22px;height:22px}
#play{background:var(--sky);color:var(--ink)}
#seek{flex:1;min-width:0;accent-color:var(--sky);height:28px;cursor:pointer}
.time{font-variant-numeric:tabular-nums;font-size:.85rem;font-weight:700;color:var(--muted);white-space:nowrap}
.note{margin:0;color:var(--muted);font-size:.85rem}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.stage:fullscreen{display:flex;align-items:center;justify-content:center;border-radius:0}
.stage:fullscreen .frame{width:min(100vw,177.78vh)}
.stage:-webkit-full-screen{display:flex;align-items:center;justify-content:center;border-radius:0;width:100%;height:100%}
.stage:-webkit-full-screen .frame{width:min(100vw,177.78vh)}
@media (max-width:680px){.stage{border-radius:12px}.time{font-size:.78rem}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="h1">Тучка</h1>
      <p class="sub" id="sub">3D-мультик без слов · 1 минута</p>
    </div>
    <div class="seg" role="group" id="langGroup" aria-label="Язык">
      <button type="button" id="lang-ru" aria-pressed="true">RU</button>
      <button type="button" id="lang-uz" aria-pressed="false">UZ</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="cv" role="img" aria-label="3D-мультфильм «Тучка»"></canvas>
      <button class="big" id="big" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l10.5-6.5z"/></svg><span id="bigLbl">Смотреть</span></button>
      <div class="msg" id="msg" hidden></div>
    </div>
  </div>

  <div class="ctrl">
    <button id="play" class="ib" type="button" aria-label="Смотреть">
      <svg id="icoPlay" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l10.5-6.5z"/></svg>
      <svg id="icoPause" viewBox="0 0 24 24" aria-hidden="true" hidden><path fill="currentColor" d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg>
    </button>
    <input id="seek" type="range" min="0" max="72" step="0.01" value="0" aria-label="Перемотка">
    <span id="time" class="time">0:00 / 1:12</span>
    <button id="mute" class="ib" type="button" aria-label="Выключить звук" aria-pressed="false">
      <svg id="icoSnd" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.2v5.6h3.6L12.5 19V5L7.6 9.2z"/><path d="M15.5 8.6a4.6 4.6 0 0 1 0 6.8M18 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      <svg id="icoMute" viewBox="0 0 24 24" aria-hidden="true" hidden><path fill="currentColor" d="M4 9.2v5.6h3.6L12.5 19V5L7.6 9.2z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </button>
    <button id="fs" class="ib" type="button" aria-label="Во весь экран">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <p class="note" id="note">Мультик без слов. Со звуком смешнее.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const DUR=72,TAU=Math.PI*2,PI=Math.PI;

const FT='"Caveat","Comic Sans MS",cursive',FB='"Nunito","Segoe UI",system-ui,sans-serif';
const STR={
 ru:{title:'Тучка',sub:'3D-мультик без слов · 1 минута',kicker:'мультик без слов',end:'Конец',watch:'Смотреть',again:'Ещё раз',pause:'Пауза',lang:'Язык',seek:'Перемотка',soundOff:'Выключить звук',soundOn:'Включить звук',fs:'Во весь экран',canvas:'3D-мультфильм «Тучка»',note:'Мультик без слов. Со звуком смешнее.',nogl:'Этому браузеру не хватает 3D (WebGL). Откройте мультик в Chrome, Safari или Firefox.',nolib:'Не загрузилась 3D-библиотека. Проверьте интернет и обновите страницу.'},
 uz:{title:'Bulutcha',sub:'So‘zsiz 3D multfilm · 1 daqiqa',kicker:'so‘zsiz multfilm',end:'Tamom',watch:'Ko‘rish',again:'Yana bir bor',pause:'Pauza',lang:'Til',seek:'Vaqt',soundOff:'Ovozni o‘chirish',soundOn:'Ovozni yoqish',fs:'To‘liq ekran',canvas:'«Bulutcha» 3D multfilmi',note:'So‘zsiz multfilm. Ovoz bilan qiziqroq.',nogl:'Bu brauzerda 3D (WebGL) ishlamaydi. Multfilmni Chrome, Safari yoki Firefox’da oching.',nolib:'3D kutubxona yuklanmadi. Internetni tekshirib, sahifani yangilang.'}

const S=()=>STR[LANG];

/* ---------- math ---------- */

let g=null;
function E(x,y,rx,ry,c,rot){g.beginPath();g.ellipse(x,y,Math.abs(rx)||.01,Math.abs(ry)||.01,rot||0,0,TAU);g.fillStyle=c;g.fill();}

function cloudFace(o){
 const m=o.mood||'happy',lk=o.look||[0,0],lx=lk[0]*5,ly=lk[1]*4,ex=26,ey=8,dk='#2f3150';
 Ci(-48,26,11,'rgba(255,135,150,.55)');Ci(48,26,11,'rgba(255,135,150,.55)');
 if(m==='strain'){Ln(-ex-9,ey-7,-ex+5,ey,dk,4);Ln(-ex+5,ey,-ex-9,ey+7,dk,4);Ln(ex+9,ey-7,ex-5,ey,dk,4);Ln(ex-5,ey,ex+9,ey+7,dk,4);g.beginPath();g.moveTo(-15,32);for(let i=1;i<=6;i++)g.lineTo(-15+i*5,32+(i%2?-3.5:3.5));g.strokeStyle=dk;g.lineWidth=3;g.lineJoin='round';g.stroke();return;}
 if(m==='sleep'){Arc(-ex,ey,8,PI*.15,PI*.85,dk,3);Arc(ex,ey,8,PI*.15,PI*.85,dk,3);Arc(0,26,6,PI*.2,PI*.8,dk,2.6);return;}
 if(m==='grin'){Arc(-ex,ey+3,9,PI*1.15,PI*1.85,dk,3.6);Arc(ex,ey+3,9,PI*1.15,PI*1.85,dk,3.6);g.beginPath();g.moveTo(-18,22);g.quadraticCurveTo(0,48,18,22);g.closePath();g.fillStyle=dk;g.fill();E(0,34,8,4.5,'#ff8a9a');return;}
 const bl=o.blink?.12:1,tired=m==='tired',eh=tired?5:11*bl;
 E(-ex+lx,ey+ly+(tired?3:0),8.5,eh,dk);E(ex+lx,ey+ly+(tired?3:0),8.5,eh,dk);
 if(!o.blink&&!tired){Ci(-ex+lx+3,ey+ly-4,3,'#fff');Ci(ex+lx+3,ey+ly-4,3,'#fff');}
 if(m==='sad'){Ln(-ex-10,ey-15,-ex+8,ey-21,dk,3);Ln(ex+10,ey-15,ex-8,ey-21,dk,3);}
 if(m==='determined'){Ln(-ex-11,ey-21,-ex+9,ey-13,dk,3.6);Ln(ex+11,ey-21,ex-9,ey-13,dk,3.6);}
 if(m==='wow'){Ln(-ex-8,ey-21,-ex+8,ey-23,dk,3);Ln(ex+8,ey-21,ex-8,ey-23,dk,3);}
 if(m==='happy'||tired)Arc(0,24,10,PI*.15,PI*.85,dk,3);
 else if(m==='sad')Arc(0,40,9,PI*1.2,PI*1.8,dk,3);
 else if(m==='wow')E(0,33,6,8,dk);
 else if(m==='determined')Ln(-10,33,10,31,dk,3.6);

 else if(m==='puff'){E(0,31,6,5,dk);Ci(-40,24,15,'rgba(255,135,150,.55)');Ci(40,24,15,'rgba(255,135,150,.55)');}
}
function sunFace(o){ // drawn around (0,0) with r=200
 const r=200,m=o.mood||'smug',gl=o.glasses,dk='#5a3410',ck=m==='blow'?1.6:1;
 Ci(-r*.52,r*.26,r*.15*ck,'rgba(255,110,70,.5)');Ci(r*.52,r*.26,r*.15*ck,'rgba(255,110,70,.5)');
 if(gl<.97){if(m==='smile'||m==='laugh'){Arc(-r*.3,-r*.04,r*.11,PI*1.15,PI*1.85,dk,9);Arc(r*.3,-r*.04,r*.11,PI*1.15,PI*1.85,dk,9);}else{E(-r*.3,-r*.08,r*.07,r*.1,dk);E(r*.3,-r*.08,r*.07,r*.1,dk);}}
 if(m==='smug'){g.beginPath();g.moveTo(-r*.24,r*.38);g.quadraticCurveTo(r*.04,r*.52,r*.3,r*.28);g.strokeStyle=dk;g.lineWidth=11;g.lineCap='round';g.stroke();}
 else if(m==='laugh'){g.beginPath();g.moveTo(-r*.32,r*.28);g.quadraticCurveTo(0,r*.82,r*.32,r*.28);g.closePath();g.fillStyle='#8a2a1a';g.fill();E(0,r*.5,r*.14,r*.07,'#ff7a6a');}
 else if(m==='blow')E(-r*.14,r*.42,r*.11,r*.13,'#8a2a1a');
 else if(m==='wow')E(0,r*.44,r*.1,r*.14,'#8a2a1a');
 else Arc(0,r*.22,r*.26,PI*.2,PI*.8,dk,11);
}
function flowerFace(s,m){
 const dk='#5a3a1a';
 if(m==='sad'){Arc(-s*.7,-s*.1,s*.3,PI*.15,PI*.85,dk,s*.16);Arc(s*.7,-s*.1,s*.3,PI*.15,PI*.85,dk,s*.16);Arc(0,s*1.05,s*.35,PI*1.2,PI*1.8,dk,s*.16);}
 else if(m==='hope'){E(-s*.7,-s*.15,s*.2,s*.28,dk);E(s*.7,-s*.15,s*.2,s*.28,dk);E(0,s*.7,s*.18,s*.22,dk);}
 else{Arc(-s*.7,s*.05,s*.3,PI*1.15,PI*1.85,dk,s*.16);Arc(s*.7,s*.05,s*.3,PI*1.15,PI*1.85,dk,s*.16);Arc(0,s*.5,s*.45,PI*.2,PI*.8,dk,s*.16);Ci(-s*1.2,s*.6,s*.25,'rgba(255,110,110,.5)');Ci(s*1.2,s*.6,s*.25,'rgba(255,110,110,.5)');}
}

/* ---------- music & sound (same score as the 2D film) ---------- */
const CH={F:[53,4],C:[48,4],Dm:[50,3],Bb:[46,4],Gm:[55,3],Am:[57,3],A:[57,4]};
const BARS=[['F',1,.7],['C',1,.7],['F',2,.75],['Dm',2,.75],['Bb',2,.75],['C',2,.75],['Dm',1,.6],['Am',1,.6],['Bb',1,.6],['C',.5,.55],
 ['F',2,.75],['C',2,.75],['F',2,.8],['Bb',2,.8],['C',2,.8],['Dm',2,.75],['Gm',2,.75],['A',2,.78],['Dm',1,.7],['A',1,.75],
 ['F',2,.9],['C',2,.9],['Dm',2,.9],['Bb',2,.9],['F',1,.7],['Am',1,.65],['Bb',1,.65],['F',1,.65],['Bb',.5,.6],['F',0,.5]];
function buildEvents(){

  ev.push({k:'pad',t:t0,d:BAR,n:[pb,pb+th,pb+7],v:vel},{k:'bass',t:t0,n:pb-12,v:vel});
  if(dens>=2)ev.push({k:'bass',t:t0+2*BEAT,n:pb-12+7,v:vel*.7});
  let pat=[];if(dens===.5)pat=[[0,3],[2,1]];else if(dens===1)pat=[[0,3],[1,2],[2,1],[3,2]];else if(dens===2)pat=[0,1,2,3,4,3,2,1].map((i,j)=>[j/2,i]);
  pat.forEach(([beat,i],j)=>ev.push({k:'bell',t:t0+beat*BEAT,n:tones[i],v:vel*(beat===0?1:.72)*(.9+.1*Math.sin(b*7+j*3)),d:1.4}));
 });
 ev.push({k:'pop',t:1.5},{k:'whee',t:7.0},{k:'ding',t:10.45},{k:'plip',t:18.3},{k:'sizzle',t:18.85},{k:'laugh',t:19.3},
  {k:'plip',t:22.45},{k:'plip',t:22.55},{k:'plip',t:22.65},{k:'splash',t:23.2},{k:'laugh',t:23.55},{k:'ding',t:25.32},{k:'whoosh',t:26.6},
  {k:'whoosh',t:27.9},{k:'slurp',t:30.4,d:3.2},{k:'splash',t:31.8},{k:'splash',t:32.8},{k:'burp',t:33.9},
  {k:'blow',t:39.2},{k:'whoosh',t:41.85},{k:'whoosh',t:44.1},{k:'inhale',t:47.0},{k:'thunder',t:48.15},{k:'rain',t:48.4,d:5.9},
  {k:'chime',t:52.5},{k:'sparkle',t:54.9},{k:'boing',t:57.4},{k:'pop',t:58.6},{k:'bell',t:69.6,n:89,v:.6,d:3});

}
const EV=buildEvents();
const mtof=m=>440*Math.pow(2,(m-69)/12);
let NOISE=null,IMP=null;
function noiseBuf(ac){if(NOISE&&NOISE.sampleRate===ac.sampleRate)return NOISE;const r=mulberry(3),len=ac.sampleRate*2,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=r()*2-1;return NOISE=b;}

function nz(ac,out,when,dur,type,freq,q,env){const s=ac.createBufferSource();s.buffer=noiseBuf(ac);s.loop=true;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const gn=ac.createGain();gn.gain.setValueAtTime(0,when);for(const [tt,v] of env)gn.gain.linearRampToValueAtTime(v,when+tt);s.connect(f);f.connect(gn);gn.connect(out);s.start(when);s.stop(when+dur+.05);return f;}
function tone(ac,out,when,type,f0,f1,dur,peak,fd){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,when);o.frequency.exponentialRampToValueAtTime(f1,when+(fd||dur));const gn=ac.createGain();gn.gain.setValueAtTime(0,when);gn.gain.linearRampToValueAtTime(peak,when+.01);gn.gain.exponentialRampToValueAtTime(.0005,when+dur);o.connect(gn);gn.connect(out);o.start(when);o.stop(when+dur+.05);}
function bell(ac,out,when,midi,vel,dur){const f=mtof(midi);const gn=ac.createGain();gn.gain.setValueAtTime(0,when);gn.gain.linearRampToValueAtTime(.19*vel,when+.006);gn.gain.exponentialRampToValueAtTime(.0006,when+dur);gn.connect(out);for(const [m,a] of [[1,1],[2,.28],[3.01,.1],[4.2,.04]]){const o=ac.createOscillator();o.type='sine';o.frequency.value=f*m;const og=ac.createGain();og.gain.value=a;o.connect(og);og.connect(gn);o.start(when);o.stop(when+dur+.05);}}

function curT(){if(graph&&actx&&actx.state==='running')return anchorT+Math.max(0,actx.currentTime-anchorA);return anchorT+(performance.now()/1000-anchorP);}
function loop(){if(!playing)return;T=curT();if(T>=DUR){T=DUR;draw();updateUI();stop(true);return;}pump();draw();updateUI();raf=requestAnimationFrame(loop);}
function play(){if(!ready)return;if(T>=DUR-.05)T=0;started=true;ended=false;playing=true;big.hidden=true;clockStart(T);setIcons();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
function stop(atEnd){playing=false;audioStop();cancelAnimationFrame(raf);setIcons();if(atEnd){ended=true;bigLbl.textContent=S().again;big.hidden=false;}}
function toggle(){playing?stop(false):play();}
btnPlay.addEventListener('click',toggle);big.addEventListener('click',play);cv.addEventListener('click',toggle);
seek.addEventListener('input',()=>{if(!ready)return;T=+seek.value;started=true;big.hidden=true;if(playing){audioStop();clockStart(T);}draw();updateUI();});
btnMute.addEventListener('click',()=>{muted=!muted;if(playing){T=curT();if(muted){audioStop();anchorT=T;anchorP=performance.now()/1000;}else clockStart(T);}setIcons();});
btnFs.addEventListener('click',()=>{const el=stage,d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return;}const req=el.requestFullscreen||el.webkitRequestFullscreen;if(!req)return;try{const p=req.call(el);if(p&&p.catch)p.catch(()=>{});}catch(e){}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!(e.target instanceof HTMLButtonElement)&&!(e.target instanceof HTMLInputElement)){e.preventDefault();toggle();}});
function showMsg(s){msg.textContent=s;msg.hidden=false;big.hidden=true;}
function applyLang(){const s=S();document.documentElement.lang=LANG;$('h1').textContent=s.title;$('sub').textContent=s.sub;$('note').textContent=s.note;bigLbl.textContent=ended?s.again:s.watch;$('langGroup').setAttribute('aria-label',s.lang);seek.setAttribute('aria-label',s.seek);btnFs.setAttribute('aria-label',s.fs);cv.setAttribute('aria-label',s.canvas);$('lang-ru').setAttribute('aria-pressed',String(LANG==='ru'));$('lang-uz').setAttribute('aria-pressed',String(LANG==='uz'));setIcons();if(ready){TXT();draw();}else if(!msg.hidden)showMsg(!T3?s.nolib:s.nogl);updateUI();}
for(const l of ['ru','uz'])$('lang-'+l).addEventListener('click',()=>{LANG=l;try{localStorage.setItem('tuchka-lang',l);}catch(e){}applyLang();});
applyLang();
if(!T3){showMsg(S().nolib);return;}
if(!glOK()){showMsg(S().nogl);return;}
try{initGL(cv);ready=true;}catch(e){showMsg(S().nogl);return;}
TXT();
if('ResizeObserver' in window)new ResizeObserver(fit).observe(frame);else window.addEventListener('resize',fit);
fit();
loadFonts().then(()=>{TXT();draw();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{TXT();draw();});
})();
</script>
