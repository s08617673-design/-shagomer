<style>

:root{

  --f-title:"Caveat","Comic Sans MS",cursive;
  --f-ui:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--cream)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.45;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:12px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top>div{min-width:0}
h1{font-family:var(--f-title);font-weight:700;font-size:clamp(2.2rem,6vw,3.3rem);line-height:.95;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:.92rem;font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}

.seg button[aria-pressed="true"]{background:var(--apricot);color:var(--ink)}
.stage{position:relative;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.frame{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;margin:0 auto;container-type:inline-size}

.cap{position:absolute;left:50%;bottom:2.3cqw;transform:translateX(-50%);width:max-content;max-width:80cqw;text-align:center;font-weight:700;font-size:2.65cqw;line-height:1.28;color:#fff6e6;background:rgba(18,14,30,.66);padding:.9cqw 2.1cqw;border-radius:1.4cqw;pointer-events:none;opacity:0;text-wrap:balance}

.ib{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:10px;border:0;background:transparent;color:var(--cream);cursor:pointer}
.ib:hover{background:rgba(255,255,255,.08)}

.time{font-variant-numeric:tabular-nums;font-size:.85rem;font-weight:700;color:var(--muted);white-space:nowrap}

</style>

/* ---------- music ---------- */
const CH={D:[62,4],G:[55,4],A:[57,4],Bm:[59,3],Em:[52,3],'F#m':[54,3]};
const BARS=[['D',1,.7],['G',1,.7],['Bm',1,.7],['G',1,.7],['A',1,.6],['Bm',.5,.55],['Em',.5,.55],['F#m',.5,.55],['G',1,.7],['A',2,.75],
 ['D',2,.8],['G',2,.8],['A',2,.8],['D',2,.8],['Bm',2,.8],['G',2,.8],['A',1,.7],['D',1,.75],['Bm',2,.75],['G',2,.75],['D',2,.75],['A',2,.75],
 ['D',2,.8],['G',2,.8],['Bm',2,.8],['A',2,.8],['G',1,.7],['D',.5,.6],['D',0,.5]];
function buildEvents(){
 const ev=[],BAR=3,BEAT=.75;
 BARS.forEach(([name,dens,vel],b)=>{
  const t0=b*BAR,[r,th]=CH[name];
  let ab=r;while(ab<67)ab+=12;while(ab>=79)ab-=12;
  const tones=[ab,ab+th,ab+7,ab+12,ab+12+th];
  let pb=r;while(pb<48)pb+=12;while(pb>=60)pb-=12;
  ev.push({k:'pad',t:t0,d:BAR,n:[pb,pb+th,pb+7],v:vel});
  ev.push({k:'bass',t:t0,n:pb-12,v:vel});
  if(dens>=2)ev.push({k:'bass',t:t0+2*BEAT,n:pb-12+7,v:vel*.7});
  let pat=[];
  if(dens===.5)pat=[[0,3],[2,1]];else if(dens===1)pat=[[0,3],[1,2],[2,1],[3,2]];else if(dens===2)pat=[0,1,2,3,4,3,2,1].map((i,j)=>[j/2,i]);
  pat.forEach(([beat,i],j)=>ev.push({k:'bell',t:t0+beat*BEAT,n:tones[i],v:vel*(beat===0?1:.72)*(.9+.1*Math.sin(b*7+j*3)),d:1.6}));
 });
 ev.push({k:'buzz',t:23.2},{k:'sparkle',t:49.7},{k:'chime',t:52.4},{k:'sparkle',t:PH_HIT},{k:'bell',t:84.0,n:86,v:.7,d:4});

}
const EV=buildEvents();
const mtof=m=>440*Math.pow(2,(m-69)/12);
function bell(ac,out,when,midi,vel,dur){const f=mtof(midi);const gn=ac.createGain();gn.gain.setValueAtTime(0,when);gn.gain.linearRampToValueAtTime(.2*vel,when+.006);gn.gain.exponentialRampToValueAtTime(.0006,when+dur);gn.connect(out);for(const [m,a] of [[1,1],[2,.28],[3.01,.1],[4.2,.04]]){const o=ac.createOscillator();o.type='sine';o.frequency.value=f*m;const og=ac.createGain();og.gain.value=a;o.connect(og);og.connect(gn);o.start(when);o.stop(when+dur+.05);}}
function pad(ac,out,when,ns,dur,vel){const gn=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;lp.Q.value=.3;const pk=.045*vel;gn.gain.setValueAtTime(0,when);gn.gain.linearRampToValueAtTime(pk,when+Math.min(.8,dur*.4));gn.gain.setValueAtTime(pk,when+Math.max(.8,dur-.4));gn.gain.linearRampToValueAtTime(0,when+dur+.7);lp.connect(gn);gn.connect(out);for(const n of ns)for(const det of [-7,7]){const o=ac.createOscillator();o.type='triangle';o.frequency.value=mtof(n);o.detune.value=det;o.connect(lp);o.start(when);o.stop(when+dur+.8);}}
function bass(ac,out,when,n,vel){const gn=ac.createGain();gn.gain.setValueAtTime(0,when);gn.gain.linearRampToValueAtTime(.16*vel,when+.02);gn.gain.exponentialRampToValueAtTime(.0006,when+1.9);gn.connect(out);const o=ac.createOscillator();o.type='sine';o.frequency.value=mtof(n);o.connect(gn);o.start(when);o.stop(when+2);}
function buzz(ac,out,when){for(const off of [0,.32]){const gn=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;const w=when+off;gn.gain.setValueAtTime(0,w);gn.gain.linearRampToValueAtTime(.12,w+.02);gn.gain.setValueAtTime(.12,w+.17);gn.gain.linearRampToValueAtTime(0,w+.2);lp.connect(gn);gn.connect(out);const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=118;o.connect(lp);o.start(w);o.stop(w+.22);}}
function playEv(ac,out,e,when,dur){
 if(e.k==='bell')bell(ac,out,when,e.n,e.v,e.d||1.6);
 else if(e.k==='pad')pad(ac,out,when,e.n,dur??e.d,e.v);
 else if(e.k==='bass')bass(ac,out,when,e.n,e.v);

let IMP=null;

function makeGraph(ac){const master=ac.createGain();master.gain.value=.9;const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;const dry=ac.createGain();dry.gain.value=.85;const wet=ac.createGain();wet.gain.value=.32;const conv=ac.createConvolver();conv.buffer=impulse(ac);const bus=ac.createGain();bus.connect(dry);bus.connect(conv);conv.connect(wet);dry.connect(comp);wet.connect(comp);comp.connect(master);master.connect(ac.destination);return{bus,master};}

const $=id=>document.getElementById(id);
