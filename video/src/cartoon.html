<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Шагомер — мультик</title>
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#F3F6F1;font-family:Inter,'DejaVu Sans',sans-serif}
svg text{font-family:Inter,'DejaVu Sans',sans-serif}
#cap{position:absolute;left:44px;right:44px;bottom:80px;display:flex;justify-content:center;pointer-events:none}
#capbox{background:rgba(255,255,255,.96);color:#16211A;border-radius:38px;padding:30px 44px;font:650 54px/1.25 Inter,sans-serif;text-align:center;box-shadow:0 12px 34px rgba(15,90,58,.22);opacity:0}
</style></head><body>
<svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BDE5F5"/><stop offset=".62" stop-color="#E9F7EF"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22995A"/><stop offset="1" stop-color="#0F5A3A"/></linearGradient>
  <linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6FBF7"/><stop offset="1" stop-color="#E2F2E7"/></linearGradient>
  <linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2C7FD0"/><stop offset="1" stop-color="#173F86"/></linearGradient>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26364A"/><stop offset="1" stop-color="#0E1621"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A6E0BC"/><stop offset="1" stop-color="#3A9E6A"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F5A3A" flood-opacity=".20"/></filter>
</defs>
<g id="scene"></g>
</svg>
<div id="cap"><div id="capbox"></div></div>
<script>
'use strict';
const TL = window.TL;
TL.scenes.forEach((s, i) => { s.i = i; });

// ---------------- helpers ----------------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, a, b) => clamp((t - a) / (b - a));
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const back = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const pop = (t, t0, d = .45) => { const x = p(t, t0, t0 + d); return x <= 0 ? 0 : back(x); };
const mod = (a, n) => ((a % n) + n) % n;
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const rnd = i => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const f2 = v => (+v).toFixed(2);
const g = (tr, inner, extra = '') => `<g transform="${tr}" ${extra}>${inner}</g>`;
const op = (a, inner) => a >= 0.999 ? inner : (a <= 0 ? '' : `<g opacity="${f2(a)}">${inner}</g>`);
const cs = s => s.chunks.map(c => ({ s: c.start - s.start, e: c.end - s.start }));
function at(s, ci, word) {
  const c = s.chunks[ci]; const i = c.cap.toLowerCase().indexOf(word.toLowerCase());
  return (c.start - s.start) + (i < 0 ? 0 : i / c.cap.length) * (c.end - c.start);
}
function qb(a, c, b, u) { const v = 1 - u; return [v * v * a[0] + 2 * v * u * c[0] + u * u * b[0], v * v * a[1] + 2 * v * u * c[1] + u * u * b[1]]; }
let UID = 0;
const _cv = document.createElement('canvas').getContext('2d');
function txt(x, y, s, size, o = {}) {
  return `<text x="${f2(x)}" y="${f2(y)}" font-size="${size}" font-weight="${o.w || 600}" fill="${o.c || '#16211A'}" text-anchor="${o.a || 'start'}" ${o.ls ? `letter-spacing="${o.ls}"` : ''} ${o.op != null ? `opacity="${f2(o.op)}"` : ''}>${s}</text>`;
}
function letters(str, cx, y, size, weight, fill, t, t0, dt) {
  _cv.font = `${weight} ${size}px Inter`;
  const chars = [...str], ws = chars.map(ch => _cv.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0);
  let x = cx - total / 2, o = '';
  chars.forEach((ch, i) => {
    const k = pop(t, t0 + i * dt, .5);
    if (k > 0) o += g(`translate(${f2(x + ws[i] / 2)},${y}) scale(${f2(k)})`, txt(0, 0, ch, size, { w: weight, c: fill, a: 'middle' }), `opacity="${f2(clamp(k * 1.6))}"`);
    x += ws[i];
  });
  return o;
}

// ---------------- small graphics ----------------
function print(x, y, s, rot, color) {
  return g(`translate(${f2(x)},${f2(y)}) rotate(${rot}) scale(${f2(s)})`,
    `<ellipse cx="0" cy="-14" rx="15" ry="24" fill="${color}"/><ellipse cx="0" cy="24" rx="11" ry="12" fill="${color}"/>`);
}
function feet(x, y, s, color) { return print(x - 17 * s, y + 9 * s, s, -12, color) + print(x + 17 * s, y - 9 * s, s, 12, color); }
function starPath(r, ri = .48) {
  let d = '';
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * ri : r; d += (i ? 'L' : 'M') + f2(Math.cos(a) * rr) + ' ' + f2(Math.sin(a) * rr); }
  return d + 'Z';
}
function star(x, y, r, fill = '#FFC83D', rot = 0, stroke = '#E0A21F') {
  return g(`translate(${f2(x)},${f2(y)}) rotate(${f2(rot)})`, `<path d="${starPath(r)}" fill="${fill}" stroke="${stroke}" stroke-width="${f2(r * .08)}" stroke-linejoin="round"/>`);
}
function coin(x, y, r) {
  return g(`translate(${f2(x)},${f2(y)})`, `<circle r="${r}" fill="#FFD27A" stroke="#C98A1B" stroke-width="${f2(r * .13)}"/><circle r="${f2(r * .7)}" fill="none" stroke="#E7AE45" stroke-width="${f2(r * .07)}"/>` +
    txt(0, r * .2, 'сум', r * .5, { w: 800, c: '#9A6510', a: 'middle' }));
}
function check(x, y, s, color = '#fff', w = 10) {
  return `<path d="M${f2(x - 22 * s)} ${f2(y + 2 * s)} L${f2(x - 6 * s)} ${f2(y + 18 * s)} L${f2(x + 24 * s)} ${f2(y - 16 * s)}" stroke="${color}" stroke-width="${f2(w * s)}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function appIcon(cx, cy, sz, v = 'green') {
  const r = sz * .23, bg = v === 'white' ? '#fff' : 'url(#hero)', fc = v === 'white' ? '#1F8A4C' : '#fff';
  return `<rect x="${f2(cx - sz / 2)}" y="${f2(cy - sz / 2)}" width="${sz}" height="${sz}" rx="${f2(r)}" fill="${bg}" filter="url(#sh)"/>` +
    feet(cx - sz * .04, cy + sz * .04, sz / 160, fc) + star(cx + sz * .29, cy - sz * .29, sz * .1, '#FFC83D', 0, '#E0A21F');
}
function gridIcon(cx, cy, s = 1, fg = '#1F8A4C', bg = '#fff') {
  return g(`translate(${f2(cx)},${f2(cy)}) scale(${f2(s)})`, `<rect x="-22" y="-27" width="44" height="54" rx="7" fill="${bg}"/><path d="M-14 -12 H14 M-14 2 H14 M-14 16 H14 M0 -19 V22" stroke="${fg}" stroke-width="4"/>`);
}
function pill(cx, cy, w, h, fill, inner, stroke) {
  return `<rect x="${f2(cx - w / 2)}" y="${f2(cy - h / 2)}" width="${w}" height="${h}" rx="${h / 2}" fill="${fill}" ${stroke ? `stroke="${stroke}" stroke-width="4"` : ''} filter="url(#sh)"/>` + inner;
}
function confetti(cx, cy, t, seed, n = 70, spd = 900) {
  if (t < 0 || t > 2.6) return '';
  const cols = ['#FFC83D', '#1F8A4C', '#FF8FA3', '#2C7FD0', '#FFFFFF', '#F28B4B'];
  let o = '';
  for (let i = 0; i < n; i++) {
    const a = rnd(seed + i) * Math.PI * 2, v = spd * (.35 + .65 * rnd(seed + i + 99));
    const x = cx + Math.cos(a) * v * t * .9, y = cy + Math.sin(a) * v * t * .75 - 380 * t + 900 * t * t;
    const r = (rnd(seed + i + 7) * 360 + t * 500 * (rnd(seed + i + 3) - .5)), al = 1 - p(t, 1.5, 2.6);
    o += `<rect x="-8" y="-13" width="16" height="26" rx="4" fill="${cols[i % cols.length]}" transform="translate(${f2(x)},${f2(y)}) rotate(${f2(r)})" opacity="${f2(al)}"/>`;
  }
  return o;
}
function sun(x, y, r, t) {
  let rays = '';
  for (let i = 0; i < 12; i++) rays += `<rect x="-7" y="${-r - 50}" width="14" height="30" rx="7" fill="#FFD27A" transform="rotate(${f2(i * 30 + t * 10)})"/>`;
  return g(`translate(${x},${y})`, rays + `<circle r="${r}" fill="#FFD27A"/><circle r="${f2(r * .76)}" fill="#FFE3A0"/>`);
}
function cloud(x, y, s) {
  return g(`translate(${f2(x)},${f2(y)}) scale(${f2(s)})`, `<g fill="#fff"><ellipse cx="0" cy="0" rx="92" ry="38"/><circle cx="-36" cy="-22" r="40"/><circle cx="22" cy="-38" r="50"/><circle cx="68" cy="-10" r="32"/></g>`);
}
function tree(x, y, s, c) {
  return g(`translate(${f2(x)},${y}) scale(${s})`, `<rect x="-13" y="-125" width="26" height="128" rx="9" fill="#8A5A3B"/><circle cx="0" cy="-178" r="82" fill="${c}"/><circle cx="-50" cy="-132" r="52" fill="${c}"/><circle cx="50" cy="-138" r="56" fill="${c}"/><circle cx="-24" cy="-206" r="30" fill="#fff" opacity=".13"/>`);
}
function bush(x, y, s) {
  return g(`translate(${f2(x)},${y}) scale(${s})`, `<circle cx="-30" cy="-18" r="34" fill="#3E9E62"/><circle cx="10" cy="-32" r="42" fill="#4AAA6E"/><circle cx="48" cy="-14" r="30" fill="#3E9E62"/>`);
}
function flower(x, y, k) {
  const c = ['#FF8FA3', '#FFFFFF', '#FFC83D', '#B9A6E6'][k % 4];
  let o = `<path d="M0 0 V24" stroke="#3E8E5A" stroke-width="4"/>`;
  for (let i = 0; i < 5; i++) { const a = i * 72 * Math.PI / 180; o += `<circle cx="${f2(Math.cos(a) * 9)}" cy="${f2(Math.sin(a) * 9)}" r="7" fill="${c}"/>`; }
  return g(`translate(${f2(x)},${y})`, o + `<circle r="5" fill="#F2A900"/>`);
}
function hill(y0, amp, wl, off, color) {
  let d = `M-10 1930 L-10 ${y0}`;
  for (let x = -10; x <= 1090; x += 18) { const v = Math.sin((x + off) / wl) * .65 + Math.sin((x + off) / (wl * .43) + 1.3) * .35; d += ` L${x} ${f2(y0 - amp * v)}`; }
  return `<path d="${d} L1090 1930 Z" fill="${color}"/>`;
}
function park(scroll, lt) {
  let o = `<rect width="1080" height="1920" fill="url(#sky)"/>` + sun(880, 245, 78, lt);
  for (let i = 0; i < 4; i++) o += cloud(mod(i * 390 - scroll * .08 - lt * 14, 1560) - 240, 150 + (i % 2) * 120 + i * 14, .8 + .22 * (i % 3));
  o += hill(1010, 55, 170, scroll * .2, '#B5E3C3') + hill(1110, 40, 120, scroll * .45 + 400, '#88CD9F');
  const sp = 360, off = mod(scroll, sp);
  for (let k = -1; k < 5; k++) { const x = k * sp - off + 150; o += tree(x, 1225, .95, k % 2 ? '#3E9E62' : '#4FB073') + bush(x + 175, 1238, .8); }
  o += `<rect x="0" y="1218" width="1080" height="702" fill="#63B97F"/>`;
  o += `<rect x="0" y="1262" width="1080" height="86" fill="#EBD9AE"/><rect x="0" y="1262" width="1080" height="8" fill="#D9C38E"/><rect x="0" y="1342" width="1080" height="6" fill="#D9C38E"/>`;
  for (let k = 0; k < 12; k++) o += `<ellipse cx="${f2(mod(k * 137 - scroll, 1200) - 60)}" cy="${1290 + (k * 37) % 44}" rx="9" ry="5" fill="#D6C08C"/>`;
  for (let k = 0; k < 12; k++) o += flower(mod(k * 157 + 40 - scroll, 1300) - 100, 1392 + (k * 53) % 90, k);
  return o;
}
function lightBg() {
  return `<rect width="1080" height="1920" fill="url(#light)"/><circle cx="930" cy="250" r="280" fill="#DFF3E6"/><circle cx="110" cy="1480" r="330" fill="#DFF3E6"/><circle cx="1000" cy="1300" r="120" fill="#E9F6EC"/>`;
}
function brand() {
  return `<rect x="36" y="44" width="292" height="80" rx="40" fill="#fff" opacity=".93" filter="url(#sh)"/>` + feet(92, 86, .42, '#1F8A4C') + txt(130, 99, 'Шагомер', 38, { w: 800, c: '#1F8A4C' });
}

// ---------------- characters ----------------
function grandma(o) {
  const { x, y, s = 1, ph = 0, walk = 0, t = 0, mood = 'smile', armL = null, armR = null, jump = 0, glow = 0 } = o;
  const sw = Math.sin(ph) * walk, legA = sw * 22, armA = sw * 26;
  const dy = 215 * (1 - Math.cos(legA * Math.PI / 180)) - 6 * Math.abs(Math.cos(ph)) * walk - jump;
  const aL = armL ?? (armA + 6), aR = armR ?? (-armA - 6);
  const blink = mod(t + .7, 3.3) < .13;
  const skin = '#F4C9A3', card = '#1F8A4C', cardD = '#17703D';
  const shoe = dx => `<path d="M${dx - 20} -6 Q${dx - 22} -40 ${dx} -40 L${dx + 10} -40 Q${dx + 44} -36 ${dx + 46} -12 Q${dx + 46} 0 ${dx + 34} 0 L${dx - 12} 0 Q${dx - 20} 0 ${dx - 20} -6Z" fill="#fff" stroke="#C8D3CC" stroke-width="3"/><path d="M${dx - 18} -13 H${dx + 44}" stroke="#1F8A4C" stroke-width="6"/>`;
  const leg = (dx, a, col) => `<g transform="rotate(${f2(a)} ${dx} -215)"><path d="M${dx} -215 V-40" stroke="${col}" stroke-width="24" stroke-linecap="round"/>${shoe(dx)}</g>`;
  const arm = (sx, a, col) => `<g transform="rotate(${f2(a)} ${sx} -432)"><path d="M${sx} -432 L${sx} -300" stroke="${col}" stroke-width="30" stroke-linecap="round"/><circle cx="${sx}" cy="-290" r="17" fill="${skin}"/></g>`;
  let b = arm(-60, aL, cardD) + leg(-16, -legA, '#3B3F56') + leg(16, legA, '#4A4F6A');
  b += `<path d="M-62 -305 L-90 -168 Q0 -154 90 -168 L62 -305Z" fill="#3D5A80"/><path d="M-82 -186 Q0 -172 82 -186" stroke="#2F4868" stroke-width="6" fill="none"/>`;
  b += `<path d="M-64 -450 Q-77 -360 -66 -292 L66 -292 Q77 -360 64 -450 Q0 -472 -64 -450Z" fill="${card}"/><path d="M0 -452 V-292" stroke="${cardD}" stroke-width="4"/>`;
  [-420, -386, -352, -318].forEach(yy => b += `<circle cx="-9" cy="${yy}" r="5.5" fill="#FFD27A"/>`);
  if (glow > 0) b += `<circle cx="40" cy="-382" r="46" fill="#FFE27A" opacity="${f2(glow * .65)}"/>`;
  b += `<rect x="27" y="-402" width="27" height="46" rx="5" fill="#1A1F2A"/><rect x="30" y="-399" width="21" height="30" rx="3" fill="${glow > 0 ? '#9BF0BE' : '#3A4A5E'}"/>`;
  b += `<rect x="18" y="-374" width="46" height="46" rx="9" fill="${cardD}"/>`;
  b += `<path d="M-27 -460 L0 -428 L27 -460Z" fill="#fff"/><rect x="-15" y="-480" width="30" height="32" rx="8" fill="${skin}"/>`;
  b += `<ellipse cx="0" cy="-560" rx="85" ry="72" fill="#C9CAD6"/><circle cx="0" cy="-642" r="37" fill="#D5D6E0"/><circle cx="-11" cy="-652" r="12" fill="#fff" opacity=".35"/>`;
  b += `<circle cx="-74" cy="-528" r="14" fill="${skin}"/><circle cx="74" cy="-528" r="14" fill="${skin}"/><circle cx="0" cy="-532" r="74" fill="${skin}"/>`;
  b += `<path d="M-77 -538 Q-75 -614 0 -612 Q75 -614 77 -538 Q57 -588 0 -582 Q-57 -588 -77 -538Z" fill="#E1E2EA"/>`;
  b += blink ? `<path d="M-35 -530 h18 M17 -530 h18" stroke="#16211A" stroke-width="5" stroke-linecap="round"/>`
    : `<ellipse cx="-26" cy="-530" rx="7" ry="9" fill="#16211A"/><ellipse cx="26" cy="-530" rx="7" ry="9" fill="#16211A"/><circle cx="-23" cy="-534" r="2.6" fill="#fff"/><circle cx="29" cy="-534" r="2.6" fill="#fff"/>`;
  b += `<g fill="#fff" fill-opacity=".18" stroke="#8C5A3C" stroke-width="5"><circle cx="-26" cy="-530" r="23"/><circle cx="26" cy="-530" r="23"/></g><path d="M-4 -533 Q0 -539 4 -533" stroke="#8C5A3C" stroke-width="5" fill="none"/>`;
  b += `<circle cx="-49" cy="-500" r="12" fill="#F28B82" opacity=".45"/><circle cx="49" cy="-500" r="12" fill="#F28B82" opacity=".45"/>`;
  b += `<path d="M-6 -507 Q0 -499 6 -507" stroke="#D9967A" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  b += mood === 'happy' ? `<path d="M-25 -488 Q0 -450 25 -488Z" fill="#8A3B2E"/><path d="M-13 -470 Q0 -460 13 -470 Q0 -477 -13 -470Z" fill="#F28B82"/>`
    : `<path d="M-20 -485 Q0 -468 20 -485" stroke="#8A3B2E" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  b += arm(60, aR, card);
  return g(`translate(${f2(x)},${f2(y)}) scale(${s}) translate(0,${f2(dy)})`, b);
}
function grandson(o) {
  const { x, y, s = 1, ph = 0, walk = 0, t = 0, mood = 'smile', armL = null, armR = null, phone = false, jump = 0 } = o;
  const sw = Math.sin(ph) * walk, legA = sw * 20, armA = sw * 24;
  const dy = 245 * (1 - Math.cos(legA * Math.PI / 180)) - 6 * Math.abs(Math.cos(ph)) * walk - jump;
  const aL = armL ?? (armA + 5), aR = armR ?? (-armA - 5);
  const blink = mod(t + 2.1, 3.7) < .13;
  const skin = '#E9B68C', hood = '#2F6FBF', hoodD = '#255A9C';
  const shoe = dx => `<path d="M${dx - 22} -6 Q${dx - 24} -42 ${dx} -42 L${dx + 12} -42 Q${dx + 48} -38 ${dx + 50} -12 Q${dx + 50} 0 ${dx + 38} 0 L${dx - 14} 0 Q${dx - 22} 0 ${dx - 22} -6Z" fill="#fff" stroke="#C8D3CC" stroke-width="3"/><path d="M${dx - 20} -14 H${dx + 48}" stroke="#2F6FBF" stroke-width="6"/>`;
  const leg = (dx, a, col) => `<g transform="rotate(${f2(a)} ${dx} -245)"><path d="M${dx} -245 V-42" stroke="${col}" stroke-width="32" stroke-linecap="round"/>${shoe(dx)}</g>`;
  const ph1 = phone ? `<rect x="58" y="-372" width="32" height="54" rx="7" fill="#16211A" transform="rotate(90 74 -345)"/><rect x="62" y="-367" width="24" height="40" rx="4" fill="#9BF0BE" transform="rotate(90 74 -345)"/>` : '';
  const arm = (sx, a, col, extra = '') => `<g transform="rotate(${f2(a)} ${sx} -494)"><path d="M${sx} -494 L${sx} -342" stroke="${col}" stroke-width="34" stroke-linecap="round"/><circle cx="${sx}" cy="-328" r="19" fill="${skin}"/>${extra}</g>`;
  let b = arm(-72, aL, hoodD) + leg(-20, -legA, '#2C3E50') + leg(20, legA, '#3B5570');
  b += `<path d="M-78 -514 Q-90 -400 -82 -250 Q0 -236 82 -250 Q90 -400 78 -514 Q0 -540 -78 -514Z" fill="${hood}"/>`;
  b += `<path d="M-54 -292 L-42 -344 H42 L54 -292Z" fill="${hoodD}"/><path d="M-16 -500 L-19 -440 M16 -500 L19 -440" stroke="#fff" stroke-width="5" stroke-linecap="round"/>`;
  b += `<path d="M-60 -524 Q0 -478 60 -524 Q40 -546 0 -546 Q-40 -546 -60 -524Z" fill="${hoodD}"/><rect x="-16" y="-528" width="32" height="26" rx="8" fill="${skin}"/>`;
  b += `<circle cx="-70" cy="-582" r="14" fill="${skin}"/><circle cx="70" cy="-582" r="14" fill="${skin}"/><circle cx="0" cy="-586" r="70" fill="${skin}"/>`;
  b += `<path d="M-74 -592 Q-84 -668 -12 -674 L2 -694 L18 -670 L40 -688 L46 -662 Q86 -652 74 -592 Q62 -634 12 -632 Q-30 -644 -74 -592Z" fill="#3B2A20"/>`;
  b += `<path d="M-40 -614 q12 -8 26 0 M14 -614 q12 -8 26 0" stroke="#3B2A20" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  b += blink ? `<path d="M-32 -590 h16 M16 -590 h16" stroke="#16211A" stroke-width="5" stroke-linecap="round"/>`
    : `<ellipse cx="-24" cy="-590" rx="7" ry="9" fill="#16211A"/><ellipse cx="24" cy="-590" rx="7" ry="9" fill="#16211A"/><circle cx="-21" cy="-594" r="2.6" fill="#fff"/><circle cx="27" cy="-594" r="2.6" fill="#fff"/>`;
  b += `<circle cx="-44" cy="-560" r="11" fill="#F28B82" opacity=".35"/><circle cx="44" cy="-560" r="11" fill="#F28B82" opacity=".35"/>`;
  b += `<path d="M-5 -568 Q0 -560 5 -568" stroke="#C98B66" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  b += mood === 'happy' ? `<path d="M-26 -546 Q0 -508 26 -546Z" fill="#7A2E24"/><path d="M-20 -546 H20 V-540 H-20Z" fill="#fff"/>`
    : `<path d="M-22 -545 Q0 -526 22 -545" stroke="#7A2E24" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  b += arm(72, aR, hood, ph1);
  return g(`translate(${f2(x)},${f2(y)}) scale(${s}) translate(0,${f2(dy)})`, b);
}

// ---------------- devices ----------------
function phone(x, y, w, content, o = {}) {
  const h = w * 2.05, r = w * .14, pad = w * .045, sw = w - 2 * pad, k = sw / 400, id = 'cp' + (UID++);
  return g(`translate(${f2(x)},${f2(y)}) ${o.tr || ''}`,
    (o.glow > 0 ? `<rect x="-18" y="-18" width="${f2(w + 36)}" height="${f2(h + 36)}" rx="${f2(r + 16)}" fill="#FFD27A" opacity="${f2(o.glow * .6)}"/>` : '') +
    `<rect width="${f2(w)}" height="${f2(h)}" rx="${f2(r)}" fill="#16211A" filter="url(#sh)"/>` +
    `<clipPath id="${id}"><rect x="${f2(pad)}" y="${f2(pad)}" width="${f2(sw)}" height="${f2(h - 2 * pad)}" rx="${f2(r * .72)}"/></clipPath>` +
    `<g clip-path="url(#${id})"><g transform="translate(${f2(pad)},${f2(pad)}) scale(${f2(k)})">${content}</g></g>` +
    `<rect x="${f2(w / 2 - w * .11)}" y="${f2(pad + 7 * k)}" width="${f2(w * .22)}" height="${f2(17 * k)}" rx="${f2(8.5 * k)}" fill="#16211A"/>`);
}
function appScreen(o) {

  b += `<circle cx="200" cy="232" r="${R}" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="20"/>`;
  if (prog > .005) b += `<circle cx="200" cy="232" r="${R}" fill="none" stroke="#FFD27A" stroke-width="20" stroke-linecap="round" stroke-dasharray="${f2(C * prog)} ${f2(C)}" transform="rotate(-90 200 232)"/>`;
  b += txt(200, 246, fmt(steps), 46, { w: 800, c: '#fff', a: 'middle' }) + txt(200, 278, 'шагов', 19, { c: '#B8E6C9', a: 'middle' });

  b += `<rect x="16" y="446" width="176" height="128" rx="24" fill="#fff"/><rect x="208" y="446" width="176" height="128" rx="24" fill="#fff"/>`;

  b += txt(24, 622, 'Последние дни', 21, { w: 750 });

function miniSheet(n, flash) {

function wipe(t) {
  let o = '';
  for (let i = 1; i < TL.scenes.length; i++) {
    const d = t - TL.scenes[i].start;
    if (Math.abs(d) < .32) {
      const k = 1 - Math.abs(d) / .32, r = 1110 * eio(k);
      o += `<circle cx="540" cy="960" r="${f2(r)}" fill="#1F8A4C"/>`;
      if (k > .55) o += op(p(k, .55, 1), feet(540, 960, 2.6, '#fff'));
    }
  }
  const fe = p(t, TL.duration - .7, TL.duration - .05);
  if (fe > 0) o += `<rect width="1080" height="1920" fill="#0F5A3A" opacity="${f2(fe)}"/>`;
  return o;
}
const capbox = document.getElementById('capbox');
function captions(t) {
  for (const s of TL.scenes) {
    if (t < s.start || t >= s.end) continue;
    const first = s.chunks[0].start - .08, last = s.end - .34;
    const boxOp = Math.min(clamp((t - first) / .2), clamp((last - t) / .15));
    let text = '', tOp = 0;
    for (let i = 0; i < s.chunks.length; i++) {
      const a = s.chunks[i].start - .08, b = i + 1 < s.chunks.length ? s.chunks[i + 1].start - .08 : last;
      if (t >= a && t < b) { text = s.chunks[i].cap; tOp = i === 0 ? 1 : clamp((t - a) / .14); }
    }
    if (boxOp <= 0 || !text) break;
    capbox.style.opacity = boxOp;
    capbox.style.transform = `translateY(${(1 - boxOp) * 30}px)`;
    capbox.innerHTML = `<span style="opacity:${tOp}">${text}</span>`;
    return;
  }
  capbox.style.opacity = 0;
}

  captions(t);
};

    if (s.name === 'sync') { const T = TM.sync(s); T.pk.forEach(ti => add(S + ti + T.fly, 'blip', .45)); add(S + T.son, 'pop', .6); }
    if (s.name === 'pay') {
      const T = TM.pay(s); add(S + .05, 'pop', .6); T.coins.forEach(tc => add(S + tc + T.coinDur, 'coin', .6));
      add(S + T.rate, 'pop', .7); add(S + T.check, 'tick', .8); add(S + T.bal, 'ding', .7);
    }
    if (s.name === 'safe') { const T = TM.safe(s); add(S + T.shield, 'pop', .8); T.icons.forEach(x => { add(S + x - .1, 'pop', .45); add(S + x + .2, 'stamp', .7); }); T.chips.forEach(x => add(S + x + T.chipDur, 'blip', .6)); }
    if (s.name === 'start') { const T = TM.start(s); add(S + .05, 'pop', .6); T.done.forEach(x => add(S + x, 'tick', .9)); add(S + T.ready, 'fanfare', 1); }
    if (s.name === 'outro') { const T = TM.outro(s); add(S + T.logo, 'pop', .8); add(S + T.title, 'sparkle', .6); }
  });
  return ev.sort((a, b) => a.t - b.t);
};
